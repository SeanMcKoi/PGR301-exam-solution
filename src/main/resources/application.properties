server.port=9999
spring.application.name=wishifai

aws.region=${AWS_REGION:eu-west-1}

app.s3.bucket=${S3_BUCKET:wishifai-uploads}
app.bedrock.model-id=${BEDROCK_MODEL_ID:eu.anthropic.claude-sonnet-4-5-20250929-v1:0}
app.metrics.namespace=${METRICS_NAMESPACE:wishifai-54}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles.http.server.requests=0.5,0.9

spring.jackson.serialization.indent-output=true
